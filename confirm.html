<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Booking | Al Samer Pool</title>
<style>:root{--bg:#FFF9F0;--ink:#3B322B;--tl:#12968F;--ln:#F1E4D0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 Inter,system-ui,sans-serif;padding:20px;display:grid;place-items:center;min-height:100vh}.c{background:#fff;border:1px solid var(--ln);border-radius:20px;padding:28px;max-width:440px;width:100%;text-align:center;box-shadow:0 18px 50px rgba(120,90,50,.12)}h1{font:600 30px Georgia,serif;margin:6px 0}.ref{font:600 28px monospace;letter-spacing:.08em;background:#FFF3DC;border-radius:12px;padding:10px;margin:14px 0}.ok{color:#2E9D63}.w{color:#B7791F}.r{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--ln);padding:8px 0}a,button{display:inline-block;margin:6px;background:var(--tl);color:#fff;border:0;padding:10px 20px;border-radius:99px;text-decoration:none;font:inherit;cursor:pointer}small{color:#85705C}.g{background:none;color:#85705C;font-size:13px}</style></head><body><div class="c"><button class="g" id="lg"></button><div id="m"></div></div>
<script>
const T={en:{ok:"Booking confirmed",wait:"Waiting for payment confirmation...",nf:"Booking not found",cx:"This booking was cancelled or expired.",ref:"Confirmation number",nm:"Name",ci:"Check-in",co:"Check-out",tot:"Total paid",cin:"from 3:00 PM",cout:"by 12:00 PM",keep:"Please keep this number. Send it to us on WhatsApp if you need to change anything.",wa:"WhatsApp us",ru:"House rules",hm:"Back to site"},
ar:{ok:"تم تأكيد الحجز",wait:"بانتظار تأكيد الدفع...",nf:"الحجز غير موجود",cx:"تم إلغاء هذا الحجز أو انتهت مهلته.",ref:"رقم التأكيد",nm:"الاسم",ci:"تسجيل الوصول",co:"تسجيل المغادرة",tot:"المبلغ المدفوع",cin:"من 3:00 مساءً",cout:"قبل 12:00 ظهرًا",keep:"يرجى الاحتفاظ بهذا الرقم، وأرسله لنا عبر واتساب إذا أردت تعديل أي شيء.",wa:"تواصل عبر واتساب",ru:"قوانين الاستراحة",hm:"العودة للموقع"}};
let L='en';try{L=localStorage.getItem('l')||((navigator.language||'').startsWith('ar')?'ar':'en')}catch(e){}
const id=new URLSearchParams(location.search).get('id')||'',$=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),fd=s=>new Intl.DateTimeFormat(L=='ar'?'ar-AE-u-nu-latn':'en-GB',{weekday:'short',day:'numeric',month:'long',year:'numeric'}).format(new Date(s+'T00:00:00'));
let B=null,n=0;
function rd(){const t=T[L];document.documentElement.lang=L;document.documentElement.dir=L=='ar'?'rtl':'ltr';$('lg').textContent=L=='ar'?'English':'العربية';let h='';
if(!B)h=`<h1>${t.nf}</h1>`;else if(['paid','completed'].includes(B.status))h=`<h1 class="ok">${t.ok}</h1><small>${t.ref}</small><div class="ref">${esc(B.ref)}</div><div class="r"><span>${t.nm}</span><b>${esc(B.name)}</b></div><div class="r"><span>${t.ci}</span><b>${fd(B.check_in)}<br><small>${t.cin}</small></b></div><div class="r"><span>${t.co}</span><b>${fd(B.check_out)}<br><small>${t.cout}</small></b></div><div class="r"><span>${t.tot}</span><b>AED ${Number(B.total).toLocaleString('en-US')}</b></div><p><small>${t.keep}</small></p><a href="https://wa.me/971586425559">${t.wa}</a><a href="/rules.html">${t.ru}</a>`;
else if(B.status=='pending')h=`<h1 class="w">${t.wait}</h1><div class="ref">${esc(B.ref||'')}</div>`;else h=`<h1>${t.cx}</h1>`;
$('m').innerHTML=h+`<br><a href="/">${t.hm}</a>`}
async function ld(){try{const r=await fetch('/api/booking?id='+encodeURIComponent(id));B=r.ok?await r.json():null}catch(e){B=null}rd();if(B&&B.status=='pending'&&n++<15)setTimeout(ld,4000)}
$('lg').onclick=()=>{L=L=='ar'?'en':'ar';try{localStorage.setItem('l',L)}catch(e){}rd()};
ld();</script></body></html>
