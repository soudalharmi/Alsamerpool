<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Al Samer Pool</title>
<style>body{font:15px system-ui;background:#FFF9F0;color:#3B322B;margin:0;padding:16px;max-width:900px;margin:auto}input,button{font:inherit;padding:8px;margin:3px;border:1px solid #ddd;border-radius:8px}button{background:#12968F;color:#fff;border:0;cursor:pointer}.c{background:#fff;border:1px solid #F1E4D0;border-radius:12px;padding:12px;margin:10px 0;overflow-x:auto}td{padding:4px 8px;border-bottom:1px solid #F1E4D0;font-size:13px}</style></head><body>
<h2>Al Samer Pool - Admin</h2>
<form id="lf" class="c"><input id="e" type="email" placeholder="Email" required><input id="p" type="password" placeholder="Password" required><button>Log in</button></form>
<div id="app" hidden>
<div class="c"><b>Prices (AED)</b><br>Weekday <input id="w" type="number" size="5"> Weekend (Fri-Sat) <input id="we" type="number"> Deposit <input id="dp" type="number"> <button onclick="sp()">Save</button></div>
<div class="c"><b>Block nights</b> (first night to last night)<br><input id="bf" type="date"><input id="bt" type="date"><input id="bn" placeholder="Note"><button onclick="bk()">Block</button></div>
<div class="c"><b>Bookings</b><table id="t"></table></div></div>
<script>
let T=sessionStorage.t||'';const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async b=>{const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:JSON.stringify(b)});if(r.status==401&&b.a!='login'){sessionStorage.t='';location.reload()}return r.json()};
$('lf').onsubmit=async e=>{e.preventDefault();const j=await api({a:'login',email:$('e').value,password:$('p').value});if(j.token){T=sessionStorage.t=j.token;ld()}else alert('Incorrect email or password')};
let PR;async function ld(){const j=await api({a:'list'});if(!j.rows)return;$('lf').hidden=true;$('app').hidden=false;PR=j.pricing;$('w').value=PR.w;$('we').value=PR.we;$('dp').value=PR.deposit;
$('t').innerHTML='<tr><td>Status<td>Guest<td>Dates<td>Total<td></tr>'+j.rows.map(r=>`<tr><td>${esc(r.status)}<td>${esc(r.name||r.note||'')} ${esc(r.phone||'')}<td>${r.check_in} to ${r.check_out}<td>${r.total||''}<td>${r.status=='paid'?`<button onclick="rf('${r.id}')">Refund deposit</button>`:''}${['paid','blocked','pending'].includes(r.status)?`<button onclick="cn('${r.id}')">Cancel</button>`:''}</tr>`).join('')}
async function rf(id){if(confirm('Refund the security deposit after check-out?')){const j=await api({a:'refund',id});alert(j.ok?'Refunded':j.error);ld()}}
async function cn(id){if(confirm('Cancel / unblock these dates?')){await api({a:'cancel',id});ld()}}
async function bk(){const j=await api({a:'block',f:$('bf').value,t:$('bt').value,note:$('bn').value});alert(j.ok?'Blocked':'Dates overlap another booking');ld()}
async function sp(){PR.w=$('w').value;PR.we=$('we').value;PR.deposit=$('dp').value;await api({a:'price',p:PR});alert('Saved')}
if(T)ld();</script></body></html>
